name: Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: kintone
        options: --health-cmd "mysqladmin ping -h localhost" --health-interval 5s --health-timeout 10s --health-retries 5

    env:
      DB_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: setup
        run: |
          cp .env.sample/.env_local .env
          cp config.sample/kintone.php config/kintone.php

      # package:discoverが動作するかを含めて依存解決を検証する
      - name: composer install
        run: composer install --prefer-dist --no-progress

      # 整形を実行し、差分が出た場合はコミット漏れとして失敗させる
      - name: pint
        run: |
          ./vendor/bin/pint
          git diff --exit-code

      - name: phpstan
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: migrate
        run: |
          php artisan key:generate
          php artisan migrate
